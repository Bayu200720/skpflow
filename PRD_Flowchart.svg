    <path d="M360 214 L360 242"/>
    <path d="M360 294 L360 306"/>
    <path d="M360 430 L360 472"/>
    <path d="M220 370 L194 370"/>
    <path d="M105 394 L105 440 L360 440 L360 472"/>
