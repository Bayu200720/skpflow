    <rect x="180" y="716" width="360" height="48" rx="8"/>
    <rect x="180" y="796" width="360" height="48" rx="8"/>
    <rect x="180" y="876" width="360" height="48" rx="8"/>
    <rect x="180" y="956" width="360" height="48" rx="8"/>
    <rect x="180" y="1036" width="360" height="48" rx="8"/>
